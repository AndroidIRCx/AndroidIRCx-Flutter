name: Release Linux

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach assets to (e.g. v1.0.16). Leave empty to derive from pubspec.yaml."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Build Linux release
        run: flutter build linux --release

      - name: Resolve version and release tag
        id: meta
        shell: bash
        run: |
          version=$(grep -E '^version:' pubspec.yaml | head -1 | sed -E 's/version:\s*//' | cut -d'+' -f1 | tr -d '[:space:]')
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          elif [[ -n "${{ github.event.inputs.tag }}" ]]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="v${version}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Version: ${version}  Tag: ${tag}"

      - name: Package portable tar.gz
        run: |
          mkdir -p release-assets
          bundle="build/linux/x64/release/bundle"
          tar -czf "release-assets/AndroidIRCx-Flutter-linux-x86_64.tar.gz" -C "$bundle" .

      - name: Build .deb package
        run: |
          version="${{ steps.meta.outputs.version }}"
          bundle="build/linux/x64/release/bundle"
          pkg="deb-root"
          rm -rf "$pkg"
          mkdir -p "$pkg/DEBIAN" \
                   "$pkg/usr/lib/androidircx" \
                   "$pkg/usr/bin" \
                   "$pkg/usr/share/applications" \
                   "$pkg/usr/share/icons/hicolor/256x256/apps"
          cp -r "$bundle/." "$pkg/usr/lib/androidircx/"
          ln -s ../lib/androidircx/androidircx "$pkg/usr/bin/androidircx"
          cp linux/packaging/androidircx.desktop \
             "$pkg/usr/share/applications/com.androidircx.flutter.desktop"
          cp assets/icon/ic_launcher_legacy.png \
             "$pkg/usr/share/icons/hicolor/256x256/apps/com.androidircx.flutter.png"
          installed_kb=$(du -s "$pkg/usr" | cut -f1)
          cat > "$pkg/DEBIAN/control" <<EOF
          Package: androidircx
          Version: ${version}
          Section: net
          Priority: optional
          Architecture: amd64
          Maintainer: AndroidIRCx <noreply@androidircx.com>
          Installed-Size: ${installed_kb}
          Depends: libgtk-3-0, libglib2.0-0, liblzma5
          Description: AndroidIRCx - Flutter IRC client
           A powerful and feature-rich IRC client for desktop Linux.
          EOF
          dpkg-deb --build --root-owner-group "$pkg" \
            "release-assets/AndroidIRCx-Flutter-linux-amd64.deb"

      - name: Build AppImage
        run: |
          bundle="build/linux/x64/release/bundle"
          appdir="AppDir"
          rm -rf "$appdir"
          mkdir -p "$appdir/usr/bin" \
                   "$appdir/usr/share/applications" \
                   "$appdir/usr/share/icons/hicolor/256x256/apps"
          cp -r "$bundle/." "$appdir/usr/bin/"
          cp linux/packaging/AppRun "$appdir/AppRun"
          chmod +x "$appdir/AppRun"
          cp linux/packaging/androidircx.desktop "$appdir/com.androidircx.flutter.desktop"
          cp linux/packaging/androidircx.desktop \
             "$appdir/usr/share/applications/com.androidircx.flutter.desktop"
          cp assets/icon/ic_launcher_legacy.png "$appdir/com.androidircx.flutter.png"
          cp assets/icon/ic_launcher_legacy.png \
             "$appdir/usr/share/icons/hicolor/256x256/apps/com.androidircx.flutter.png"
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$appdir" \
            "release-assets/AndroidIRCx-Flutter-linux-x86_64.AppImage"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            release-assets/AndroidIRCx-Flutter-linux-x86_64.tar.gz
            release-assets/AndroidIRCx-Flutter-linux-amd64.deb
            release-assets/AndroidIRCx-Flutter-linux-x86_64.AppImage

      - name: Attach Linux packages to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          fail_on_unmatched_files: true
          files: |
            release-assets/AndroidIRCx-Flutter-linux-x86_64.tar.gz
            release-assets/AndroidIRCx-Flutter-linux-amd64.deb
            release-assets/AndroidIRCx-Flutter-linux-x86_64.AppImage
